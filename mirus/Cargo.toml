[package]
name = "mirus"
version = "0.1.0"
edition = "2024"
description = "arch linux mirror ranking library inspired by reflector"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
futures = { workspace = true }
reqwest = { version = "0.12.22", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
